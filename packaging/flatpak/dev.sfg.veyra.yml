app-id: dev.akashi.veyra
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: veyra
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-config/veyra:create
  - --filesystem=xdg-config/orchard:create
modules:
  - name: veyra-packages
    buildsystem: simple
    build-commands:
      - test -f veyra-packages && install -Dm755 veyra-packages /app/lib/veyra-packages/veyra-packages || install -Dm755 orchard-packages /app/lib/veyra-packages/veyra-packages
      - install -Dm644 resources.neu /app/lib/veyra-packages/resources.neu
      - install -Dm755 extensions/* /app/lib/veyra-packages/extensions/
      - install -Dm755 veyra /app/bin/veyra
      - ln -s veyra /app/bin/orchard
      - install -Dm755 veyra-packages-launcher /app/bin/veyra-packages
      - ln -s veyra-packages /app/bin/orchard-packages
      - test -f dev.akashi.veyra.desktop && install -Dm644 dev.akashi.veyra.desktop /app/share/applications/dev.akashi.veyra.desktop || install -Dm644 dev.sfg.orchard.desktop /app/share/applications/dev.akashi.veyra.desktop
      - test -f dev.akashi.veyra.png && install -Dm644 dev.akashi.veyra.png /app/share/icons/hicolor/512x512/apps/dev.akashi.veyra.png || install -Dm644 dev.sfg.orchard.png /app/share/icons/hicolor/512x512/apps/dev.akashi.veyra.png
      - install -Dm644 dev.sfg.veyra.metainfo.xml /app/share/metainfo/dev.akashi.veyra.metainfo.xml
    sources:
      - type: dir
        path: bundle
